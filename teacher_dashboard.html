<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선생님 전용 상담 관리 대시보드</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #4f46e5;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', system-ui, sans-serif; }
    body { background: var(--bg); color: #334155; padding: 24px 16px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    .auth-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.9); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .auth-card { background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
    .auth-card h2 { margin-bottom: 12px; color: #0f172a; }
    .auth-card input { width: 100%; padding: 12px; margin: 16px 0; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 1.1rem; }
    .auth-card button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; color: #0f172a; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-card h3 { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; }
    .stat-card .val { font-size: 1.8rem; font-weight: 700; color: #0f172a; }

    .controls { background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls input, .controls select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    .controls input[type="search"] { flex: 1; min-width: 200px; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 14px 16px; text-align: left; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; font-weight: 600; color: #475569; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .badge-wait { background: #fef3c7; color: #d97706; }
    .badge-approve { background: #dcfce7; color: #15803d; }
    .badge-cancel { background: #fee2e2; color: #b91c1c; }

    .btn-export { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-refresh { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2>🔒 선생님 인증</h2>
      <p style="font-size: 0.85rem; color: #64748b;">관리자 비밀번호를 입력해 주세요.</p>
      <input type="password" id="passInput" placeholder="비밀번호 입력" onkeyup="if(event.key==='Enter') checkAuth()">
      <button onclick="checkAuth()">접속하기</button>
    </div>
  </div>

  <div class="container" id="mainContent" style="display: none;">
    <header>
      <h1>⚙️ 선생님 전용 상담 관리 대시보드</h1>
      <div style="display: flex; gap: 8px;">
        <button class="btn-refresh" onclick="loadDashboardData()">🔄 새로고침</button>
        <button class="btn-export" onclick="exportToCSV()">📊 엑셀(CSV)</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><h3>전체 신청 건수</h3><div class="val" id="statTotal">0</div></div>
      <div class="stat-card"><h3>학생 신청</h3><div class="val" id="statStudent">0</div></div>
      <div class="stat-card"><h3>학부모 신청</h3><div class="val" id="statParent">0</div></div>
      <div class="stat-card"><h3>비대면 상담</h3><div class="val" id="statPhone">0</div></div>
    </div>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="이름 또는 연락처 검색..." oninput="renderTable()">
      <select id="filterType" onchange="renderTable()">
        <option value="">전체 구분</option>
        <option value="학생">학생</option>
        <option value="학부모">학부모</option>
      </select>
      <select id="filterMethod" onchange="renderTable()">
        <option value="">전체 방식</option>
        <option value="대면">대면</option>
        <option value="비대면">비대면</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>신청일시</th>
          <th>구분</th>
          <th>성함/학적</th>
          <th>연락처</th>
          <th>방식</th>
          <th>희망일시</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="text-align: center; color: #94a3b8;">데이터를 불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const ADMIN_PASS = "teacher1234";
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbzQGicxujn6nQObs1mCk5_49Gvmb-6lnmMT8UGqZMBvsDHtF6-JvphX4rcnj3UigIa7Ug/exec';
    let reservationsData = [];

    function checkAuth() {
      const input = document.getElementById('passInput').value;
      if(input === ADMIN_PASS) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        loadDashboardData();
      } else {
        alert('비밀번호가 올바르지 않습니다.');
      }
    }

    async function loadDashboardData() {
      try {
        const res = await fetch(scriptUrl);
        const data = await res.json();
        if(Array.isArray(data)) {
          reservationsData = data;
          updateStats();
          renderTable();
        }
      } catch(err) {
        console.error(err);
        alert('구글 시트에서 데이터를 불러오지 못했습니다.');
      }
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = reservationsData.length;
      document.getElementById('statStudent').innerText = reservationsData.filter(r => r.applicantType === '학생').length;
      document.getElementById('statParent').innerText = reservationsData.filter(r => r.applicantType === '학부모').length;
      document.getElementById('statPhone').innerText = reservationsData.filter(r => r.method === '비대면').length;
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const fType = document.getElementById('filterType').value;
      const fMethod = document.getElementById('filterMethod').value;

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const filtered = reservationsData.filter(item => {
        const matchesSearch = (item.name || '').toLowerCase().includes(search) || (item.details || '').toLowerCase().includes(search);
        const matchesType = !fType || item.applicantType === fType;
        const matchesMethod = !fMethod || item.method === fMethod;
        return matchesSearch && matchesType && matchesMethod;
      });

      if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 24px;">신청 내역이 없습니다.</td></tr>`;
        return;
      }

      filtered.reverse().forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.timestamp || '-'}</td>
          <td><b>${item.applicantType}</b></td>
          <td>${item.name}</td>
          <td>${item.details}</td>
          <td>${item.method}</td>
          <td>${item.date} (${item.time})</td>
          <td><span class="badge ${item.status === '승인완료' ? 'badge-approve' : item.status === '취소됨' ? 'badge-cancel' : 'badge-wait'}">${item.status || '대기중'}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportToCSV() {
      if(reservationsData.length === 0) return alert('내보낼 데이터가 없습니다.');
      
      let csv = "\uFEFF신청일시,구분,성함,연락처,상담방식,상담날짜,상담시간,사전내용,상태\n";
      reservationsData.forEach(r => {
        csv += `"${r.timestamp}","${r.applicantType}","${r.name}","${r.details}","${r.method}","${r.date}","${r.time}","${(r.notes||'').replace(/"/g, '""')}","${r.status||'대기중'}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `상담신청_명단_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }
  </script>
</body>
</html>
